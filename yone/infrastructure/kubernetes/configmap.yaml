apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: yone
data:
  NODE_ENV: "production"
  SERVICE_NAME: "notification-service"
  PORT: "3005"
  LOG_LEVEL: "info"
  LOG_TO_FILE: "true"
  LOG_FILE_PATH: "/app/logs"
  LOG_FILE_MAX_SIZE: "10485760"
  LOG_FILE_ROTATE_DAYS: "7"
  NEWRELIC_LOGS_ENABLED: "false"
  NEWRELIC_LOGS_ENDPOINT: "https://log-api.newrelic.com/log/v1"
  NEW_RELIC_ENABLED: "false"
  NEW_RELIC_APP_NAME: "yone-service"
  NEW_RELIC_LOG_LEVEL: "info"
  SHUTDOWN_TIMEOUT_MS: "10000"
  # HTTP hardening
  CORS_ALLOWED_ORIGINS: ""
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "1 minute"
  TRUST_PROXY: "true"
  HTTP_BODY_LIMIT_BYTES: "65536"
  HTTP_CONNECTION_TIMEOUT_MS: "10000"
  HTTP_REQUEST_TIMEOUT_MS: "30000"
  NOTIFICATION_TIMEOUT_MS: "5000"
  # Email configuration (optional if using SendGrid)
  # EMAIL_FROM_ADDRESS: "noreply@example.com"
  # EMAIL_FROM_NAME: "Example Notifications"
  # SMS configuration (optional if using Twilio)
  # TWILIO_SMS_FROM: "+1234567890"
