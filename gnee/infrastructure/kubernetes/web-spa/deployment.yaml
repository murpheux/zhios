# The SPA's VITE_* config (gateway URL, OIDC issuer/client id — none of it secret) is baked in at
# image build time by Vite. The only runtime config is the CSP connect-src origins in
# configmap.yaml, rendered into the nginx config by the image's envsubst entrypoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-spa
  namespace: gnee
  labels:
    app: web-spa
spec:
  # No spec.replicas: the HPA (hpa.yaml) owns the replica count.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web-spa
  template:
    metadata:
      labels:
        app: web-spa
    spec:
      automountServiceAccountToken: false
      # nginx-unprivileged's nginx user is uid/gid 101
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web-spa
      containers:
        - name: web-spa
          # Built from infrastructure/docker/web-spa.Dockerfile. Explicit release tag, never :latest
          # (terraform overrides this with var.web_spa_image); ideally pin @sha256:...
          image: gnee/web-spa:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: web-spa-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # nginx pid + client/proxy temp paths
            - name: tmp
              mountPath: /tmp
            # envsubst renders templates here at startup
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
