name: gnee-android-ci

on:
  push:
    branches: [main]
    paths:
      - "gnee/apps/android/**"
      - "gnee/packages/**"
      - "gnee/package.json"
  pull_request:
    branches: [main]
    paths:
      - "gnee/apps/android/**"
      - "gnee/packages/**"
      - "gnee/package.json"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: gnee

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run lint -w @gnee/android

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @gnee/android

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm test -w @gnee/android

  # Builds a real emulator APK and drives it with Detox — needs KVM/emulator,
  # so it only runs on demand (slow + flaky as a required check).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      # NOTE: pin to a verified commit SHA before merging — tag used here pending SHA verification.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Prebuild native Android project
        working-directory: gnee/apps/android
        run: npx expo prebuild --platform android --non-interactive
      - name: Build e2e APKs
        working-directory: gnee/apps/android
        run: npm run e2e:build
      # NOTE: pin to a verified commit SHA before merging — tag used here pending SHA verification.
      - name: Run Detox e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: gnee/apps/android
          script: npm run e2e:test

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
