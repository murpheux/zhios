apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-service-config
  namespace: zuma
data:
  NODE_ENV: "production"
  SERVICE_NAME: "transaction-service"
  PORT: "3002"
  LOG_LEVEL: "info"
  JWT_ISSUER: "zuma"
  # OIDC path: set both together — JWT_AUDIENCE is required whenever JWT_JWKS_URI is set.
  # JWT_JWKS_URI: "https://idp.example.com/.well-known/jwks.json"
  # JWT_AUDIENCE: "zuma-api"
  JWT_ALGORITHMS: "RS256"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.zuma.svc.cluster.local:4318"
  METRICS_ENABLED: "true"
  DOCS_ENABLED: "false"
  INTERNAL_JWT_ISSUER: "zuma-internal"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "1 minute"
  RATE_LIMIT_SERVICE_MAX: "1000"
  # Behind the ingress controller / kube-proxy: honour X-Forwarded-* for client IPs (rate limiting)
  TRUST_PROXY: "true"
  HTTP_BODY_LIMIT_BYTES: "65536"
  HTTP_CONNECTION_TIMEOUT_MS: "10000"
  HTTP_REQUEST_TIMEOUT_MS: "30000"
  SHUTDOWN_TIMEOUT_MS: "10000"
  WALLET_SERVICE_URL: "http://wallet-service.zuma.svc.cluster.local:3001"
  BITCOIN_NETWORK: "testnet"
  # NODE_ENV=production rejects the mock adapter at startup. NOTE: no "rpc" adapter is
  # implemented yet — this deployment will not serve until one exists (see infrastructure/README.md).
  BITCOIN_ADAPTER: "rpc"
