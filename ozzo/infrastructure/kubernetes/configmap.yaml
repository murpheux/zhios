apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: ozzo
data:
  NODE_ENV: "production"
  PORT: "3004"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  LOG_TO_FILE: "true"
  LOG_FILE_PATH: "/app/logs"
  LOG_FILE_MAX_SIZE: "10485760"
  LOG_FILE_ROTATE_DAYS: "7"
  NEWRELIC_LOGS_ENABLED: "false"
  NEWRELIC_LOGS_ENDPOINT: "https://log-api.newrelic.com/log/v1"
  NEW_RELIC_ENABLED: "false"
  NEW_RELIC_APP_NAME: "ozzo-service"
  NEW_RELIC_LOG_LEVEL: "info"
  # Cache configuration (TTL in seconds)
  CACHE_TTL_SECONDS: "300"
  # Okta OIDC (configure with actual values from your Okta tenant)
  OKTA_ISSUER_BASE_URL: "https://dev-CHANGE_ME.okta.com"
  OKTA_AUDIENCE: "CHANGE_ME"
  # OKTA_JWKS_URI: optional, defaults to ${OKTA_ISSUER_BASE_URL}/v1/keys
  ADMIN_GROUP: "ozzo-admin"
  # Wallet service (zuma) integration
  WALLET_SERVICE_URL: "http://wallet-service.zuma.svc.cluster.local:3001"
  WALLET_SERVICE_NAME: "wallet-service"
  WALLET_SERVICE_TIMEOUT_MS: "5000"
  INTERNAL_JWT_ISSUER: "ozzo"
  USE_MOCK_ZUMA: "false"
