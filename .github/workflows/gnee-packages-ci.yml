name: gnee-packages-ci

on:
  push:
    branches: [main]
    paths:
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/eslint.config.js"
  pull_request:
    branches: [main]
    paths:
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/eslint.config.js"

permissions:
  contents: read

defaults:
  run:
    working-directory: gnee

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @gnee/api-client
      - run: npm run typecheck -w @gnee/mobile-ui

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm test -w @gnee/api-client
      - run: npm test -w @gnee/mobile-ui

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
