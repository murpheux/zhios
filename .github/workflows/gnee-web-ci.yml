name: gnee-web-ci

on:
  push:
    branches: [main]
    paths:
      - "gnee/apps/web/**"
      - "gnee/packages/**"
      - "gnee/package.json"
  pull_request:
    branches: [main]
    paths:
      - "gnee/apps/web/**"
      - "gnee/packages/**"
      - "gnee/package.json"

permissions:
  contents: read

defaults:
  run:
    working-directory: gnee

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run lint -w @gnee/web-spa

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @gnee/web-spa

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm test -w @gnee/web-spa

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run build -w @gnee/web-spa

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        working-directory: gnee/apps/web/spa
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: gnee/apps/web/spa
        run: npm run e2e
      # NOTE: pin to a verified commit SHA before merging — tag used here pending SHA verification.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: gnee/apps/web/spa/playwright-report/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
