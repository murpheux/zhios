version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zinga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zinga
      POSTGRES_PASSWORD: zinga
      POSTGRES_DB: zinga_wallet
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U zinga -d zinga_wallet -h localhost',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for local development
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zinga-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - debug

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: zinga-network
