name: gnee-packages-ci

# TODO: pin actions to full commit SHAs (e.g. via pinact / dependabot).
# actions/checkout and actions/setup-node are already SHA-pinned; every other `uses:` below is
# pinned to a version tag only.

on:
  push:
    branches: [main]
    paths:
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/biome.json"
      - "gnee/package-lock.json"
      - ".github/workflows/gnee-packages-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/biome.json"
      - "gnee/package-lock.json"
      - ".github/workflows/gnee-packages-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: gnee

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9a763f55713c49f # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-node@60edb5dd545a775178fba24c34f6c787fcc0a3e8 # v4.0.3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9a763f55713c49f # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-node@60edb5dd545a775178fba24c34f6c787fcc0a3e8 # v4.0.3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @gnee/api-client
      - run: npm run typecheck -w @gnee/mobile-ui

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9a763f55713c49f # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-node@60edb5dd545a775178fba24c34f6c787fcc0a3e8 # v4.0.3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm test -w @gnee/api-client
      - run: npm test -w @gnee/mobile-ui

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9a763f55713c49f # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-node@60edb5dd545a775178fba24c34f6c787fcc0a3e8 # v4.0.3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - name: npm audit (moderate for transitive deps from Expo/React Native)
        run: npm audit --audit-level=moderate || true
