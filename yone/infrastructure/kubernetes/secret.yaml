# Template only — CHANGE_ME placeholders. Do NOT kubectl-apply this with real values and never
# commit it filled in: source these keys from External Secrets Operator (AWS Secrets Manager/SSM)
# or Sealed Secrets instead — see infrastructure/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: yone
type: Opaque
stringData:
  # Comma-separated service tokens (each >= 16 chars) accepted in the x-service-token header
  # of /api/v1/notifications/*. Production requires at least one.
  ALLOWED_SERVICE_TOKENS: "CHANGE_ME"
  # Email: SendGrid API key (optional if not using email notifications)
  SENDGRID_API_KEY: "CHANGE_ME"
  # SMS: Twilio credentials (optional if not using SMS notifications)
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  # Optional: Twilio Messaging Service SID (alternative to TWILIO_SMS_FROM)
  # TWILIO_MESSAGING_SERVICE_SID: "CHANGE_ME"
  # Chat: JSON maps of target name -> incoming-webhook URL
  # Example: {"alerts": "https://hooks.slack.com/services/..."}
  SLACK_WEBHOOK_URLS: "CHANGE_ME"
  TEAMS_WEBHOOK_URLS: "CHANGE_ME"
  # Optional: New Relic license key (only if NEW_RELIC_ENABLED=true)
  NEW_RELIC_LICENSE_KEY: "CHANGE_ME"
