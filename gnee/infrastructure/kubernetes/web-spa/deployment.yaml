# No ConfigMap/Secret here: the SPA's VITE_* config (gateway URL, OIDC issuer/client id —
# none of it secret, see infrastructure/docker/web-spa.Dockerfile) is baked in at image
# build time by Vite, not read at container runtime. Roll out a new image built with the
# right --build-arg values per environment instead of editing env here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-spa
  namespace: gnee
  labels:
    app: web-spa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-spa
  template:
    metadata:
      labels:
        app: web-spa
    spec:
      containers:
        - name: web-spa
          # Replace with the image built from infrastructure/docker/web-spa.Dockerfile
          image: gnee/web-spa:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
