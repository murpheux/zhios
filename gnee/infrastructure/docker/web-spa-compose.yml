# Local web-spa container (nginx-unprivileged on 127.0.0.1:8080), included by the repo-root
# docker-compose.yml. Usable on its own from gnee/:
#   docker compose -f infrastructure/docker/web-spa-compose.yml up -d --build
#
# None of the VITE_* values are secret (public OIDC SPA client: Authorization Code + PKCE, no
# client secret). Defaults target the root local stack: gateway on localhost:3003 and the mock
# OIDC provider on localhost:8090 (issuer http://localhost:8090/zuma). localhost is a secure
# context, so PKCE (crypto.subtle) works over plain http here.
#
# Hardened like the zuma services: read-only rootfs, all capabilities dropped, non-root (uid 101).
# The nginx entrypoint renders /etc/nginx/templates/*.template into /etc/nginx/conf.d at start,
# so that directory (and /tmp for pid + temp files) is tmpfs.

services:
  web-spa:
    image: ${IMAGE_PREFIX:-zhios}/web-spa:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infrastructure/docker/web-spa.Dockerfile
      args:
        VITE_ZUMA_GATEWAY_URL: ${VITE_ZUMA_GATEWAY_URL:-http://localhost:3003/graphql}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8090/zuma}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-gnee-web-spa}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:8080/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:8080}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-zuma-api}
    restart: unless-stopped
    environment:
      # CSP connect-src / frame-src / form-action origins (no paths)
      ZUMA_GATEWAY_ORIGIN: ${ZUMA_GATEWAY_ORIGIN:-http://localhost:3003}
      OIDC_AUTHORITY_ORIGIN: ${OIDC_AUTHORITY_ORIGIN:-http://localhost:8090}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      # mode=1777: the entrypoint renders templates here as uid 101; a root-owned 0755 tmpfs makes it
      # skip rendering, leaving nginx with no server block on :8080.
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - web-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  web-net:
    driver: bridge
