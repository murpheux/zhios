# Template only — CHANGE_ME placeholders. Do NOT kubectl-apply this with real values and never
# commit it filled in: source these keys from External Secrets Operator (AWS Secrets Manager/SSM)
# or Sealed Secrets instead — see infrastructure/README.md.
# MONGODB_URI/JWT_SECRET/INTERNAL_JWT_SECRET are required by the shared base env schema even though
# the gateway has no DB of its own.
apiVersion: v1
kind: Secret
metadata:
  name: graphql-gateway-secret
  namespace: zuma
type: Opaque
stringData:
  MONGODB_URI: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  # >= 32 chars, MUST differ from JWT_SECRET; identical value in all three service secrets
  INTERNAL_JWT_SECRET: "CHANGE_ME"
  # >= 16 chars; without it /metrics is disabled in production
  METRICS_TOKEN: "CHANGE_ME"
