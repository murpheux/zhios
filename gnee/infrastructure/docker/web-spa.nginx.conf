# Rendered at container start by the nginx image's envsubst entrypoint
# (/etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf).
# Only variables present in the environment are substituted, so nginx's own $uri etc. survive.
server {
    # IPv4 only: Docker bridge networks usually run without IPv6, and a hard-coded [::] listener
    # makes nginx exit at startup ("Address family not supported"), so the healthcheck never passes.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Probe endpoint for Docker/Swarm/k8s — no file I/O, no logs
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing (react-router BrowserRouter) — serve index.html for any unmatched
    # path so /wallets/:id, /callback etc. resolve on hard refresh.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed filenames under /assets/ — cache forever. A missing asset is a
    # real 404, never index.html (that would be served as JS/CSS with the wrong MIME type).
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
