name: gnee-ios-ci

# TODO: pin actions to full commit SHAs (e.g. via pinact / dependabot).
# actions/checkout and actions/setup-node are already SHA-pinned; every other `uses:` below is
# pinned to a version tag only.

on:
  push:
    branches: [main]
    paths:
      - "gnee/apps/ios/**"
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/package-lock.json"
      - "gnee/biome.json"
      - ".github/workflows/gnee-ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gnee/apps/ios/**"
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/package-lock.json"
      - "gnee/biome.json"
      - ".github/workflows/gnee-ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: gnee

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run lint -w @gnee/ios

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @gnee/ios

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm test -w @gnee/ios

  # Builds a real simulator binary and drives it with Detox — needs Xcode, so
  # it only runs on demand (slow + macOS runner minutes are expensive).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - name: Prebuild native iOS project
        working-directory: gnee/apps/ios
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build e2e binary
        working-directory: gnee/apps/ios
        run: npm run e2e:build
      - name: Run Detox e2e tests
        working-directory: gnee/apps/ios
        run: npm run e2e:test

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
