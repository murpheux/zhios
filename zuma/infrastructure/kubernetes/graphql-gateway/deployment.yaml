apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: zuma
  labels:
    app: graphql-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          # Replace with the image built from infrastructure/docker/graphql-gateway.Dockerfile
          image: zuma/graphql-gateway:latest
          ports:
            - containerPort: 3003
              name: http
          envFrom:
            - configMapRef:
                name: graphql-gateway-config
            - secretRef:
                name: graphql-gateway-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            # Gateway exposes no /readyz; /healthz is its only health route
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
