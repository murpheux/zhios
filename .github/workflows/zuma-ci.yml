name: zuma-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: zuma

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zuma/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zuma/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zuma/package-lock.json
      - run: npm ci
      - run: npm test --workspaces --if-present

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zuma/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, security]
    strategy:
      matrix:
        service:
          - name: wallet-service
            dockerfile: infrastructure/docker/wallet-service.Dockerfile
          - name: transaction-service
            dockerfile: infrastructure/docker/transaction-service.Dockerfile
          - name: graphql-gateway
            dockerfile: infrastructure/docker/graphql-gateway.Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build ${{ matrix.service.name }} image
        working-directory: zuma
        run: |
          docker build \
            -f "${{ matrix.service.dockerfile }}" \
            -t "zuma/${{ matrix.service.name }}:ci" \
            .
      # NOTE: pin to a verified commit SHA before merging — tag used here pending SHA verification.
      - name: Scan ${{ matrix.service.name }} image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zuma/${{ matrix.service.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zuma/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
