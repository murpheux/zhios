name: gnee-android-ci

# TODO: pin actions to full commit SHAs (e.g. via pinact / dependabot).
# actions/checkout and actions/setup-node are already SHA-pinned; every other `uses:` below is
# pinned to a version tag only.

on:
  push:
    branches: [main]
    paths:
      - "gnee/apps/android/**"
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/package-lock.json"
      - "gnee/biome.json"
      - ".github/workflows/gnee-android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gnee/apps/android/**"
      - "gnee/packages/**"
      - "gnee/package.json"
      - "gnee/package-lock.json"
      - "gnee/biome.json"
      - ".github/workflows/gnee-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: gnee

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run lint -w @gnee/android

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @gnee/android

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm test -w @gnee/android

  # Builds a real emulator APK and drives it with Detox — needs KVM/emulator,
  # so it only runs on demand (slow + flaky as a required check).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Prebuild native Android project
        working-directory: gnee/apps/android
        run: npx expo prebuild --platform android --non-interactive
      - name: Build e2e APKs
        working-directory: gnee/apps/android
        run: npm run e2e:build
      - name: Run Detox e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: gnee/apps/android
          script: npm run e2e:test

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnee/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
