# Local DEVELOPMENT stack — run from zuma/: docker compose up -d --build
# Build contexts are "." (zuma/ root) because services/* and graphql/ depend on shared/*
# npm workspace packages — see infrastructure/docker/*.Dockerfile for details.
#
# Secrets come ONLY from the process environment, resolved from 1Password at run time:
#   op run --env-file=zuma.op.env -- docker compose up -d --build     (from zuma/)
#   op run --env-file=deploy/env/local.op.env -- docker compose up -d --build   (root stack)
# `op plugin run` does not resolve op:// references; use `op run --env-file`. A plain zuma/.env
# (git-ignored, e.g. from `make secrets-local`) still works as a fallback, but must never contain
# op:// references when compose runs without `op run`. Nothing secret is set inline here.
# Required keys:
#   MONGO_ROOT_PASSWORD     Mongo root password (MONGO_ROOT_USERNAME optional, default zuma_admin)
#   JWT_SECRET              client-facing HS256 secret, >= 32 chars
#   INTERNAL_JWT_SECRET     service-to-service HS256 secret, >= 32 chars, MUST differ from JWT_SECRET
#                           (required by the base schema on all three services, gateway included)
#   METRICS_TOKEN           bearer token guarding /metrics, >= 16 chars
# Optional (only via the .env fallback): JWT_JWKS_URI + JWT_AUDIENCE (audience required with JWKS).
#
# NODE_ENV=development is deliberate: transaction-service refuses BITCOIN_ADAPTER=mock under
# NODE_ENV=production, and this stack has no real Bitcoin node. Production runs via k8s/Lambda.
#
# Mongo: single node with auth, no replica set. Nothing in zuma uses multi-document
# transactions or change streams today; if that changes, add --replSet plus a --keyFile
# generated at startup (never committed) — auth + replSet requires internal keyfile auth.

x-service-common: &service-common
  restart: unless-stopped
  env_file:
    - path: .env
      required: false # optional fallback; 1Password-injected env is the primary source
  networks:
    - zuma-net
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:?run via op run --env-file=zuma.op.env (or set JWT_SECRET)}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?run via op run --env-file=zuma.op.env (or set INTERNAL_JWT_SECRET)}
  METRICS_TOKEN: ${METRICS_TOKEN:?run via op run --env-file=zuma.op.env (or set METRICS_TOKEN)}
  NODE_ENV: development
  LOG_LEVEL: info
  JWT_ISSUER: zuma
  # No otel-collector service is included in this compose file; exporter calls fail silently
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  METRICS_ENABLED: "true"
  DOCS_ENABLED: "true"
  INTERNAL_JWT_ISSUER: zuma-internal
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: 1 minute
  RATE_LIMIT_SERVICE_MAX: "1000"
  # Clients hit the containers directly in local dev — no proxy to trust
  TRUST_PROXY: "false"
  HTTP_BODY_LIMIT_BYTES: "65536"
  HTTP_CONNECTION_TIMEOUT_MS: "10000"
  HTTP_REQUEST_TIMEOUT_MS: "30000"
  SHUTDOWN_TIMEOUT_MS: "10000"

services:
  mongo:
    image: mongo:7.0.14 # TODO: pin by digest (docker buildx imagetools inspect mongo:7.0.14)
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-zuma_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run via op run --env-file=zuma.op.env (or set MONGO_ROOT_PASSWORD)}
    ports:
      # Bound to localhost only — Mongo must never be reachable from outside the host
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # ping needs no auth, so no credentials end up in the healthcheck's process args
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - zuma-net

  wallet-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/wallet-service.Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      <<: *service-env
      SERVICE_NAME: wallet-service
      PORT: "3001"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-zuma_admin}:${MONGO_ROOT_PASSWORD:?run via op run --env-file=zuma.op.env (or set MONGO_ROOT_PASSWORD)}@mongo:27017/zuma-wallet?authSource=admin
      TRANSACTION_SERVICE_URL: http://transaction-service:3002
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  transaction-service:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/transaction-service.Dockerfile
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      <<: *service-env
      SERVICE_NAME: transaction-service
      PORT: "3002"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-zuma_admin}:${MONGO_ROOT_PASSWORD:?run via op run --env-file=zuma.op.env (or set MONGO_ROOT_PASSWORD)}@mongo:27017/zuma-transaction?authSource=admin
      WALLET_SERVICE_URL: http://wallet-service:3001
      BITCOIN_NETWORK: testnet
      # Explicit: dev-only mock chain client/signer (rejected by config under NODE_ENV=production)
      BITCOIN_ADAPTER: mock
    depends_on:
      mongo:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  graphql-gateway:
    <<: *service-common
    build:
      context: .
      dockerfile: infrastructure/docker/graphql-gateway.Dockerfile
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      <<: *service-env
      SERVICE_NAME: graphql-gateway
      PORT: "3003"
      # Unused by the gateway's own logic but required by the shared env schema
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-zuma_admin}:${MONGO_ROOT_PASSWORD:?run via op run --env-file=zuma.op.env (or set MONGO_ROOT_PASSWORD)}@mongo:27017/zuma-graphql?authSource=admin
      WALLET_SERVICE_URL: http://wallet-service:3001
      TRANSACTION_SERVICE_URL: http://transaction-service:3002
      # gnee web-spa: Vite dev server (5173) and local nginx container (8080)
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      CORS_ALLOW_CREDENTIALS: "false"
      UPSTREAM_TIMEOUT_MS: "5000"
      GRAPHQL_QUERY_DEPTH: "8"
      # Dev convenience only; disabled in k8s
      GRAPHQL_INTROSPECTION_ENABLED: "true"
    depends_on:
      wallet-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3003/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  zuma-net:
    driver: bridge

volumes:
  mongo-data:
