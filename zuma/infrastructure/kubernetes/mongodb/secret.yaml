# Template only — CHANGE_ME placeholders. Source from External Secrets Operator / Sealed Secrets
# (see infrastructure/README.md); never commit real values. Service MONGODB_URIs must use these
# credentials with ?authSource=admin (or, better, per-service least-privilege users).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: zuma
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "CHANGE_ME"
  MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME"
