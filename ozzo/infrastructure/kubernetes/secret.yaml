# Template only — CHANGE_ME placeholders. Do NOT kubectl-apply this with real values and never
# commit it filled in: source these keys from External Secrets Operator (AWS Secrets Manager/SSM)
# or Sealed Secrets instead — see infrastructure/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ozzo
type: Opaque
stringData:
  # PostgreSQL connection string — sourced from RDS (see terraform/)
  # Format: postgresql://user:password@host:port/database
  DATABASE_URL: "CHANGE_ME"
  # Redis connection string — sourced from ElastiCache or self-hosted
  # Format: redis://[:password@]host:port/db
  REDIS_URL: "CHANGE_ME"
  # Service-to-service JWT secret (>= 32 chars) — MUST match INTERNAL_JWT_SECRET across services
  # If ozzo needs to call wallet-service with authentication
  INTERNAL_JWT_SECRET: "CHANGE_ME"
  # Okta client credentials (if using OIDC for app-level auth)
  # OKTA_CLIENT_ID: "CHANGE_ME"
  # OKTA_CLIENT_SECRET: "CHANGE_ME"
  # Optional: New Relic license key (only if NEW_RELIC_ENABLED=true)
  NEW_RELIC_LICENSE_KEY: "CHANGE_ME"
